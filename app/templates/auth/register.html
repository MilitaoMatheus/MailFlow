{% extends "base.html" %}

{% block title %}Criar Conta - MailFlow{% endblock %}

{% block public_content %}
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 space-y-6">
    <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center mx-auto shadow-lg shadow-indigo-500/30">
            <i data-lucide="user-plus" class="w-6 h-6"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Criar Novo Perfil</h2>
        <p class="text-sm text-slate-500">Comece a gerenciar suas campanhas e contatos isoladamente</p>
    </div>

    {% if error %}
    <div class="p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-3">
        <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="/register" class="space-y-4">
        <div>
            <label for="name" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Nome do Perfil / Usuário</label>
            <div class="relative">
                <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
                <input type="text" id="name" name="name" value="{{ name or '' }}" required autofocus
                    placeholder="João da Silva ou Minha Empresa"
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>
        </div>

        <div>
            <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">E-mail de Acesso</label>
            <div class="relative">
                <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required
                    placeholder="joao@empresa.com"
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>
        </div>

        <div>
            <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">Senha Segura</label>
            <div class="relative">
                <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
                <input type="password" id="password" name="password" required minlength="6"
                    placeholder="Mínimo de 6 caracteres"
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
            </div>
        </div>

        <button type="submit"
            class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-indigo-600/30 transition flex items-center justify-center gap-2">
            <span>Criar Perfil e Acessar</span>
            <i data-lucide="check" class="w-4 h-4"></i>
        </button>
    </form>

    <div class="text-center pt-4 border-t border-slate-100 text-xs text-slate-500">
        Já possui uma conta?
        <a href="/login" class="text-indigo-600 font-semibold hover:underline">Fazer login</a>
    </div>
</div>
{% endblock %}
